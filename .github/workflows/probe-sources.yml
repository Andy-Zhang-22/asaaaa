# 探路：看看動產擔保、工廠登記、政府採購決標、進出口廠商這幾份公開資料撈不撈得到。
#
# 為什麼要有這支：開發環境連不出政府網站，只有 Actions 的 runner 出得去。
# 這是一次性的探路，結果看完就把這支跟 tools/probe-sources.mjs 一起刪掉。
# 不碰任何客戶名單，查的全是公開目錄。
name: 探路：公開名單來源

on:
  workflow_dispatch:
  push:
    branches:
      - claude/telemarketing-website-hf2uwj
    paths:
      - 'tools/probe-sources.mjs'
      - '.github/workflows/probe-sources.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 探路
        run: node tools/probe-sources.mjs 2>&1 | tee probe.txt
      - name: 把結果印在執行紀錄上
        if: always()
        run: |
          {
            echo '```'
            cat probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
