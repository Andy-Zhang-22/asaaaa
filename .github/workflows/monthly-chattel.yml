# 每月抓一次新北市「動產擔保登記清冊」，整理成 CSV 存進 leads/chattel/，
# 網站的「快到期」分頁讀這裡：同業的動產抵押、附條件買賣案件，契約快到期的就是換約時機。
#
# 為什麼在 GitHub Actions：政府網站沒有 CORS，瀏覽器抓不到；開發環境連不上政府網站；
# 只有 Actions 的 runner 出得去，而且不需要任何人的電腦開著。
#
# 資料每月更新（上一版截到 7 月初，9 月底看到的是「8 月更新」那版），排在每月 10 日
# 台灣時間 10:00（UTC 02:00）。也可以手動觸發。
name: 每月動保清冊

on:
  schedule:
    - cron: '0 2 10 * *'
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: '只補成立年，不抓清冊'
        type: boolean
        required: false
        default: false
      founded_minutes:
        description: '查成立年最多跑幾分鐘（查不完下次接著查）'
        required: false
        default: '300'

permissions:
  contents: write
  actions: write   # 時間到還沒查完，自己再排下一輪

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓清冊並整理成 CSV
        if: inputs.skip_fetch != true
        run: |
          node tools/fetch-chattel.mjs | tee fetch-chattel.log
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"; cat fetch-chattel.log >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      # 清冊上沒有成立日期。這一步拿客戶統編查商工登記填進「成立日期」欄，快到期的先查；
      # 查到的存在 leads/chattel/founded.json（另外一份快取，跟新公司清冊的分開 commit 才不會撞），
      # 時間到就收工存檔，下次接著查。
      - name: 補上成立年
        id: founded
        continue-on-error: true
        env:
          MINUTES: ${{ inputs.founded_minutes || '300' }}
        run: |
          node tools/fill-founded.mjs --source chattel --minutes "$MINUTES" --concurrency 6 | tee fill-founded.log
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"; cat fill-founded.log >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A leads/chattel
          if git diff --cached --quiet; then echo "清冊沒有變動"; exit 0; fi
          git commit -m "動保清冊與成立年：$(date -u +%Y-%m-%d)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # GitHub 一個工作最多 6 小時。時間到還有剩的，存好之後自己再排一輪接著查，跑到完為止。
      # （連不上政府網站而收工的不在此列：那種情況重排也只是再撞一次，等下個月的排程。）
      - name: 還沒查完，再排一輪
        if: steps.founded.outputs.timeout == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.founded_minutes || '300' }}
        run: |
          echo "還剩 ${{ steps.founded.outputs.remaining }} 家，再排一輪"
          gh workflow run monthly-chattel.yml --ref "$GITHUB_REF_NAME" -f skip_fetch=true -f founded_minutes="$MINUTES"
