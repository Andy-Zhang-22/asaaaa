# 每週日傍晚（台灣時間 18:00）更新公司登記資料。
#
# 為什麼放在 GitHub Actions：開發環境的對外網路擋掉政府網站，但 Actions 的 runner
# 沒有這個限制，而且不需要使用者的電腦開著，才有辦法真的做到「自動」。
#
# 目前是探測階段：先跑一次把各來源實際回什麼記下來，再照著寫解析程式。
name: 每週公司登記資料更新

on:
  schedule:
    # 台灣時間每週日 18:00 = UTC 週日 10:00
    - cron: '0 10 * * 0'
  workflow_dispatch:
    inputs:
      tax_id:
        description: '要拿來測試查詢的統一編號（公開資料即可）'
        required: false
        default: '22099131'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 探測各資料來源
        env:
          PROBE_TAX_ID: ${{ inputs.tax_id || '22099131' }}
        run: node tools/probe-sources.mjs

      - name: 把報告印在執行紀錄上
        if: always()
        run: cat probe-report.md >> "$GITHUB_STEP_SUMMARY"

      # 暫時掛在這裡跑一次每月清冊（monthly-leads.yml 要先進預設分支才能手動觸發）。
      # 合併之後這一段可以拿掉，之後由 monthly-leads.yml 自己排程。
      - name: 抓每月新公司清冊
        run: |
          which pdftotext >/dev/null 2>&1 || sudo apt-get install -y -q poppler-utils
          node tools/fetch-leads.mjs | tee fetch-leads.log
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"; cat fetch-leads.log >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: 清冊 CSV 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads
          if git diff --cached --quiet; then echo "清冊沒有變動"; exit 0; fi
          git commit -m "每月新公司清冊：$(date -u +%Y-%m-%d)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: 保留原始回應供後續分析
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: |
            probe-report.md
            probe-raw.json
          retention-days: 30
