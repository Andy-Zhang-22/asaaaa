# 每週日傍晚（台灣時間 18:00）更新公司登記資料。
#
# 為什麼放在 GitHub Actions：開發環境的對外網路擋掉政府網站，但 Actions 的 runner
# 沒有這個限制，而且不需要使用者的電腦開著，才有辦法真的做到「自動」。
#
# 目前是探測階段：先跑一次把各來源實際回什麼記下來，再照著寫解析程式。
name: 每週公司登記資料更新

on:
  schedule:
    # 台灣時間每週日 18:00 = UTC 週日 10:00
    - cron: '0 10 * * 0'
  workflow_dispatch:
    inputs:
      tax_id:
        description: '要拿來測試查詢的統一編號（公開資料即可）'
        required: false
        default: '22099131'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 探測各資料來源
        env:
          PROBE_TAX_ID: ${{ inputs.tax_id || '22099131' }}
        run: node tools/probe-sources.mjs

      - name: 把報告印在執行紀錄上
        if: always()
        run: cat probe-report.md >> "$GITHUB_STEP_SUMMARY"

      # 找新客戶的來源（每月清冊、工廠登記、政府採購決標）。結果直接印在 log：
      # 開發環境連不上 artifact 的下載網址，只有 Actions 的 log 讀得到。
      - name: 探測新客戶名單來源
        if: always()
        run: node tools/probe-leads.mjs | tee probe-leads.log

      - name: 新客戶來源印在摘要上
        if: always()
        run: |
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          cat probe-leads.log >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: 保留原始回應供後續分析
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: |
            probe-report.md
            probe-raw.json
          retention-days: 30
