# 飲料店系統自己的 CI：每次推上來、每個 PR 都跑一次計價測試。
# 用 Node 內建的 test runner，沒有任何 npm 套件要裝。
# （這個檔案放在 drink-shop/ 底下時不會被 asaaaa 的 GitHub 執行；搬到自己的 repo 後就會生效。）
name: 自動測試

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 跑測試
        run: npm test
