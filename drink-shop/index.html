<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>紅茶洋行 點餐系統</title>
<meta name="description" content="飲料店點餐、結帳、製作單、每日營業報表、菜單價格管理。資料只存在本機瀏覽器。">
<meta name="theme-color" content="#b7412e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧋</text></svg>">
<link rel="stylesheet" href="css/app.css?v=20260926-1">
</head>
<body data-theme="auto">

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">🧋</span>
    <div>
      <h1 id="shopName">紅茶洋行</h1>
      <p class="brand-sub">大大杯紅茶小賣所 ・ 點餐系統</p>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="pos" aria-selected="true">點餐</button>
    <button role="tab" data-tab="orders" aria-selected="false">訂單</button>
    <button role="tab" data-tab="report" aria-selected="false">報表</button>
    <button role="tab" data-tab="menu" aria-selected="false">菜單設定</button>
  </nav>
</header>

<!-- ===== 點餐 ===== -->
<main id="tab-pos" class="page">
  <div class="pos">
    <section>
      <div id="cats" class="cats"></div>
      <div id="items" class="items"></div>
    </section>
    <aside class="cart card" id="cartPanel">
      <h2>這一單</h2>
      <div id="cartLines" class="cart-lines"></div>
      <div class="totals" id="cartTotals"></div>
      <div class="pay" id="payBox" hidden>
        <div class="row">
          <label class="field grow"><span>收現金</span><input type="number" id="cashIn" inputmode="numeric" placeholder="0"></label>
          <div class="field"><span>找零</span><div class="change" id="changeOut">—</div></div>
        </div>
        <div class="cash" id="cashQuick"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-ghost btn-sm" id="btnClearCart">清空</button>
        <span class="grow"></span>
        <button class="btn btn-primary btn-lg" id="btnCheckout" disabled>結帳</button>
      </div>
    </aside>
  </div>
  <div class="cart-bar" id="cartBar" hidden>
    <span id="cartBarText">0 杯</span>
    <b id="cartBarTotal">$0</b>
    <span>看這一單 ›</span>
  </div>
</main>

<!-- ===== 訂單 ===== -->
<main id="tab-orders" class="page" hidden>
  <div class="card">
    <div class="row">
      <label class="field"><span>日期</span><input type="date" id="ordersDate"></label>
      <button class="btn btn-sm" id="ordersToday">今天</button>
      <span class="grow"></span>
      <span class="muted" id="ordersSummary"></span>
    </div>
  </div>
  <div id="ordersList" class="orders" style="margin-top:12px"></div>
</main>

<!-- ===== 報表 ===== -->
<main id="tab-report" class="page" hidden>
  <div class="card">
    <div class="row">
      <div class="chips" id="reportRange">
        <button class="chip" data-range="today" aria-pressed="true">今天</button>
        <button class="chip" data-range="yesterday">昨天</button>
        <button class="chip" data-range="week">本週</button>
        <button class="chip" data-range="month">本月</button>
        <button class="chip" data-range="custom">自訂</button>
      </div>
      <span class="grow"></span>
      <button class="btn btn-sm" id="btnExportCsv">匯出 CSV</button>
    </div>
    <div class="row" id="reportCustom" hidden style="margin-top:8px">
      <label class="field"><span>從</span><input type="date" id="reportFrom"></label>
      <label class="field"><span>到</span><input type="date" id="reportTo"></label>
    </div>
  </div>
  <div class="card"><div class="stats" id="reportStats"></div></div>
  <div class="card"><h2>賣最好的</h2><div id="reportItems"></div></div>
  <div class="card"><h2>各系列</h2><div id="reportCats"></div></div>
  <div class="card"><h2>時段（杯數）</h2><div id="reportHours" class="bars"></div></div>
  <div class="card"><h2>加料</h2><div id="reportToppings"></div></div>
</main>

<!-- ===== 菜單設定 ===== -->
<main id="tab-menu" class="page menu-edit" hidden>
  <div class="card">
    <h2>店家與活動</h2>
    <div class="row">
      <label class="field"><span>店名</span><input type="text" id="setShopName"></label>
      <label class="field"><span>買幾送幾</span>
        <div class="row nowrap"><span>買</span><input type="number" id="setPromoBuy" min="1" style="width:64px"><span>送</span><input type="number" id="setPromoFree" min="0" style="width:64px"></div>
      </label>
      <label class="field"><span>活動</span><select id="setPromoEnabled"><option value="1">開啟（結帳自動折）</option><option value="0">關閉</option></select></label>
    </div>
    <p class="muted" style="font-size:13px;margin:8px 0 0">買5送1 的算法：每滿 6 杯送最便宜的那杯（茶價免費，加料照收）。</p>
  </div>
  <div class="card">
    <h2>加料</h2>
    <div id="setToppings"></div>
  </div>
  <div class="card">
    <h2>品項與價格</h2>
    <p class="muted" style="font-size:13px;margin:0 0 6px">改完會立刻存到這台裝置。XL 留空 = 只賣 L。「售完」會讓點餐頁按不下去。</p>
    <div id="setItems"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn btn-sm" id="btnAddCat">＋ 新增系列</button>
    </div>
  </div>
  <div class="card">
    <h2>資料</h2>
    <div class="row">
      <button class="btn" id="btnBackup">下載備份 JSON</button>
      <button class="btn" id="btnRestore">還原備份 JSON</button>
      <input type="file" id="restoreFile" accept="application/json" hidden>
      <span class="grow"></span>
      <button class="btn btn-danger" id="btnResetMenu">菜單恢復預設</button>
      <button class="btn btn-danger" id="btnClearOrders">清除所有訂單</button>
    </div>
    <p class="muted" style="font-size:13px;margin:8px 0 0">所有資料只存在這台裝置的瀏覽器，換手機或清快取前先下載備份。</p>
  </div>
</main>

<!-- 選規格 -->
<dialog id="dlgItem">
  <form method="dialog">
    <div class="dlg-head"><h2 id="dlgItemName">品名</h2><button type="button" class="x" data-close>×</button></div>
    <div class="dlg-body">
      <div class="opt-group" id="optSize"><label>尺寸</label><div class="chips"></div></div>
      <div class="opt-group" id="optSugar"><label>糖量</label><div class="chips"></div></div>
      <div class="opt-group" id="optIce"><label>冰量</label><div class="chips"></div></div>
      <div class="opt-group" id="optTop"><label>加料（可複選）</label><div class="chips"></div></div>
      <div class="opt-group"><label>備註</label><input type="text" id="optNote" placeholder="例：去冰半糖打包、少珍珠"></div>
    </div>
    <div class="dlg-foot">
      <div class="qty"><button type="button" id="qtyMinus">−</button><span id="qtyVal">1</span><button type="button" id="qtyPlus">＋</button></div>
      <div class="grow right"><b id="optPrice">$0</b></div>
      <button type="button" class="btn btn-primary btn-lg" id="btnAddLine">加入</button>
    </div>
  </form>
</dialog>

<!-- 製作單 -->
<dialog id="dlgTicket">
  <div class="dlg-head"><h2>製作單</h2><button type="button" class="x" data-close>×</button></div>
  <div class="dlg-body"><div class="ticket" id="ticket"></div></div>
  <div class="dlg-foot">
    <button type="button" class="btn" id="btnPrint">列印</button>
    <span class="grow"></span>
    <button type="button" class="btn btn-primary btn-lg" data-close>下一單</button>
  </div>
</dialog>

<script src="js/menu.js?v=20260926-1"></script>
<script src="js/pricing.js?v=20260926-1"></script>
<script src="js/store.js?v=20260926-1"></script>
<script src="js/app.js?v=20260926-1"></script>
</body>
</html>
