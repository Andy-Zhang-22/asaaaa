<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>徵信資料｜中小企業貸款</title>
<meta name="description" content="把客戶的金融負債、銷貨／進貨廠商、進銷貨比較、不動產、財務報表填進六個標題，一鍵產出送銀行用的 Excel。資料只存在本機瀏覽器。">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📑</text></svg>">
<link rel="stylesheet" href="assets/css/app.css?v=20260919-98">
<link rel="stylesheet" href="assets/css/crm.css?v=20260919-98">
<link rel="stylesheet" href="assets/css/dossier.css?v=20260919-98">
</head>
<body data-theme="auto">

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">📑</span>
    <div>
      <h1>徵信資料</h1>
      <p class="brand-sub" id="brandSub">六張表 → 一份 Excel</p>
    </div>
  </div>

  <div class="search-wrap">
    <input id="search" type="search" placeholder="搜尋公司、統編、負責人…" autocomplete="off">
    <kbd>/</kbd>
  </div>

  <div class="topbar-actions">
    <a class="btn btn-ghost nav-link" href="index.html" title="電話推廣名單">📞 名單</a>
    <button id="btnNew" class="btn btn-primary">＋ 新增一份</button>
    <button id="btnMenu" class="btn btn-ghost" aria-haspopup="true" title="更多">⋯</button>
    <div id="menu" class="menu" hidden>
      <button data-act="export-json">下載備份 JSON</button>
      <button data-act="import-json">還原備份 JSON</button>
      <hr>
      <button data-act="theme">切換深色／淺色</button>
      <hr>
      <button data-act="check-update">檢查更新</button>
      <div class="menu-version" id="menuVersion"></div>
    </div>
  </div>
</header>

<main class="dossier-main">
  <!-- 列表 -->
  <section id="listView">
    <div class="list-head">
      <span id="listSummary">—</span>
    </div>
    <div id="cards" class="cards"></div>
    <div id="emptyState" class="empty" hidden>
      <strong>還沒有任何徵信資料</strong>
      <p>按右上角「新增一份」，輸入公司名稱後，把資料填進六個標題，就能下載跟範例一樣的 Excel。</p>
    </div>
  </section>

  <!-- 編輯 -->
  <section id="editView" hidden>
    <div class="edit-head">
      <button id="btnBack" class="btn btn-ghost" type="button">← 返回列表</button>
      <div class="head-fields">
        <label>公司名稱 <input id="fCompany" list="customerList" placeholder="公司全名（會印在乙表上）"></label>
        <datalist id="customerList"></datalist>
        <label>統一編號 <input id="fTaxId" placeholder="8 碼"></label>
        <label>負責人 <input id="fOwner"></label>
        <label>基準日 <input id="fBaseDate" placeholder="202608" title="年月，例如 202608"></label>
      </div>
      <div class="head-actions">
        <span id="saveState" class="muted">尚未儲存</span>
        <button id="btnImportFile" class="btn" type="button" title="把 PDF、Excel 或 CSV 丟進來，自動認出六張表的內容">📥 匯入 PDF／Excel</button>
        <button id="btnExcel" class="btn btn-primary" type="button">⬇ 下載 Excel</button>
        <button id="btnDelete" class="btn btn-ghost danger-text" type="button" title="刪除這份資料">🗑</button>
      </div>
    </div>

    <nav class="tabs section-tabs" id="sectionTabs"></nav>

    <div class="paste-tip muted">
      小技巧：按「匯入 PDF／Excel」或直接把檔案拖到這一頁，會自動認出金融負債、銷貨／進貨廠商、不動產、財務報表；
      也可以從 Excel 複製好幾格再貼到表格的任一格，會自動往右、往下填滿；多行文字的欄位可以按 Shift+Enter 換行。
    </div>

    <div id="sectionHost"></div>
  </section>
</main>

<input id="jsonPick" type="file" accept="application/json,.json" hidden>
<input id="importPick" type="file" accept="application/pdf,.pdf,.xlsx,.xls,.xlsm,text/csv,.csv" multiple hidden>

<!-- 匯入預覽 -->
<div id="importDlg" class="drawer" hidden>
  <div class="drawer-backdrop" data-close></div>
  <div class="modal import-modal" role="dialog" aria-modal="true" aria-label="匯入預覽">
    <button class="drawer-close" data-close aria-label="關閉">✕</button>
    <h2>匯入預覽</h2>
    <p class="muted" id="importIntro">認出下面這些表格，確認要放到哪個段落後按「匯入」。數字照原檔的單位帶入，請留意是「元」還是「仟元」。</p>
    <div id="importFound"></div>
    <div class="import-actions">
      <label class="import-replace"><input id="importReplace" type="checkbox"> 先清空該段落原有的資料再匯入（不勾＝附加在後面）</label>
      <div>
        <button class="btn btn-ghost" type="button" data-close>取消</button>
        <button id="btnImportApply" class="btn btn-primary" type="button">匯入</button>
      </div>
    </div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="updateBar" class="update-bar" hidden>
  <span>網站有新版本可用</span>
  <button id="btnUpdate" class="btn btn-primary" type="button">立即更新</button>
  <button id="btnUpdateLater" class="btn btn-ghost" type="button">稍後</button>
</div>

<script src="assets/vendor/exceljs/exceljs.min.js?v=20260919-98"></script>
<script src="assets/vendor/xlsx/xlsx.min.js?v=20260919-98"></script>
<script src="assets/vendor/pdfjs/pdf.min.js?v=20260919-98"></script>
<script src="assets/js/pdf-table.js?v=20260919-98"></script>
<script src="assets/js/crm-store.js?v=20260919-98"></script>
<script src="assets/js/dossier-model.js?v=20260919-98"></script>
<script src="assets/js/dossier-excel.js?v=20260919-98"></script>
<script src="assets/js/dossier-import.js?v=20260919-98"></script>
<script src="assets/js/dossier.js?v=20260919-98"></script>
</body>
</html>
